name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chromium de docker-compose.yml: el mismo navegador que en local, así las capturas
      # coinciden. npm test también lo levanta (pretest); aquí va aparte para ver su log.
      - name: Start browser (Docker)
        run: npm run browser:up

      - name: Run tests
        run: npm test

      # Si cambia alguna captura: la actual y la diferencia de cada una, para verlas
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: .vitest-attachments
          if-no-files-found: ignore
          retention-days: 7
